{% extends 'base.html' %}
{% block content %}

<div class="glass col-md-5 mx-auto p-4">

    <h4>➕ Add Task</h4>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <!-- Название задачи -->
        <input class="form-control mb-3" name="title" placeholder="Title" value="{{ request.POST.title|default:'' }}">

        <!-- Описание задачи -->
        <textarea class="form-control mb-3" name="description" placeholder="Description">{{ request.POST.description|default:'' }}</textarea>

        <!-- Статус задачи -->
        <select class="form-control mb-3" name="status">
            <option value="todo" {% if request.POST.status == 'todo' %}selected{% endif %}>Todo</option>
            <option value="in_progress" {% if request.POST.status == 'in_progress' %}selected{% endif %}>In Progress</option>
            <option value="done" {% if request.POST.status == 'done' %}selected{% endif %}>Done</option>
        </select>

        <!-- Дедлайн -->
        <input type="date" class="form-control mb-3" name="deadline" value="{{ request.POST.deadline|default:'' }}">

        <button class="btn btn-success w-100">Create</button>
    </form>

</div>

<select class="form-control mb-3" name="owner">
    {% for user in users %}
        <option value="{{ user.id }}">{{ user.username }}</option>
    {% endfor %}
</select>

{% endblock %}
