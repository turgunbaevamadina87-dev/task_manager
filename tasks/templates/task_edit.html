{% extends 'base.html' %}

{% block title %}Edit Task{% endblock %}

{% block content %}
<div class="glass col-md-5 mx-auto p-4 shadow rounded">

    <h4 class="mb-4 text-center">✏️ Edit Task</h4>

    <form method="post">
        {% csrf_token %}

        <!-- Title -->
        <input class="form-control mb-3" type="text" name="title" value="{{ task.title }}" placeholder="Task Title" required>

        <!-- Description -->
        <textarea class="form-control mb-3" name="description" placeholder="Task Description (min 10 chars)" required>{{ task.description }}</textarea>

        <!-- Status -->
        <select class="form-control mb-3" name="status" required>
            <option value="todo" {% if task.status == 'Todo' %}selected{% endif %}>To Do</option>
            <option value="in_progress" {% if task.status == 'In progress' %}selected{% endif %}>In Progress</option>
            <option value="done" {% if task.status == 'Done' %}selected{% endif %}>Done</option>
        </select>

        <!-- Deadline -->
        <input class="form-control mb-3" type="date" name="deadline" value="{{ task.deadline|date:'Y-m-d' }}" required>

        <button class="btn btn-primary w-100">Save Changes</button>
    </form>

</div>
{% endblock %}
